[workspace]
resolver = "2"
members = [
    "crates/wallet-core",
    "crates/wallet-net",
    "crates/wallet-ffi",
    "crates/wallet-btc",
    "crates/celaut-proto",
    "crates/celaut-wire",
    "crates/celaut-client",
    "crates/celaut-balancer",
    "crates/celaut-catalog",
    "crates/celaut-net",
    "crates/celaut-tor",
    "tools/gen-protos",
    "crates/vendor/citadel-core",
    "crates/vendor/ergo-tx",
    "crates/vendor/ergo-node-client",
    "crates/vendor/ergopay-core",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["arkadianet"]
license = "GPL-3.0-only"
repository = "https://github.com/arkadianet/argus"

[workspace.dependencies]
# ─── Core Ergo (pinned SHA) ──────────────────────────────────────────────
# A develop commit, not a crates.io release: the newest release (0.28.0, 2024)
# lacks APIs Argus uses, and its ergo-chain-types requires url ~2.2, which
# cannot resolve alongside reqwest. 1633e018 is develop head (0.29.0, not yet
# released), carrying signing fixes; see docs/dependency-list.md.
ergo-lib = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-chain-types = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergotree-ir = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergotree-interpreter = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
sigma-ser = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-merkle-tree = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-nipopow = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-rest = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }

# ─── Async ───────────────────────────────────────────────────────────────
futures = "0.3"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync"] }

# ─── Serialization ───────────────────────────────────────────────────────
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ─── Error handling ──────────────────────────────────────────────────────
thiserror = "2"
anyhow = "1"

# ─── Logging / tracing ───────────────────────────────────────────────────
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ─── Crypto utilities ────────────────────────────────────────────────────
hex = "0.4"
base16 = "0.2"
zeroize = { version = "1.9", features = ["zeroize_derive"] }
sha2 = "0.11"
hmac = "0.13"

# ─── KDF + encryption ────────────────────────────────────────────────────
argon2 = "0.6"
aes-gcm = "0.11"
rand = "0.10"

# ─── FFI ─────────────────────────────────────────────────────────────────
flutter_rust_bridge = "=2.13.0"

# ─── HTTP ────────────────────────────────────────────────────────────────
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "socks"] }
# reqwest 0.13 dropped its bundled-roots rustls feature, so wallet-net::http
# builds the TLS config 0.12's "rustls-tls" gave: ring and webpki-roots.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

# ─── Bitcoin ─────────────────────────────────────────────────────────────
# The Bitcoin wallet (issue #92): descriptors, coin selection, PSBT, chain graph.
# No chain client crate: wallet-btc asks an Esplora server through wallet-net::http,
# so there is one reqwest and one TLS stack, and the network route (Tor) applies.
bdk_wallet = { version = "=3.2.0", default-features = false, features = ["std"] }
wallet-btc = { path = "crates/wallet-btc" }

# ─── Celaut ──────────────────────────────────────────────────────────────
# bee-rpc is GPL-3.0-only. It is a git dependency on a tag until a release exists.
bee-rpc = { git = "https://github.com/bee-rpc-protocol/bee-rpc-over-grpc-rs", tag = "v0.3.0", features = ["grpc"] }
celaut-proto = { path = "crates/celaut-proto" }
celaut-balancer = { path = "crates/celaut-balancer" }
celaut-catalog = { path = "crates/celaut-catalog" }
celaut-wire = { path = "crates/celaut-wire" }
celaut-net = { path = "crates/celaut-net" }
celaut-tor = { path = "crates/celaut-tor" }

# ─── Vendored Citadel crates ─────────────────────────────────────────────
citadel-core = { path = "crates/vendor/citadel-core" }
ergo-node-client = { path = "crates/vendor/ergo-node-client" }
ergo-tx = { path = "crates/vendor/ergo-tx" }
ergopay-core = { path = "crates/vendor/ergopay-core" }

# ─── Misc ────────────────────────────────────────────────────────────────
indexmap = "2"
num-bigint = "0.5"
num-traits = "0.2"

# Patch ergo crates to the pinned SHA (mirrors Citadel's patch approach)
[patch.crates-io]
ergo-lib = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-chain-types = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergotree-ir = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergotree-interpreter = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
sigma-ser = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-merkle-tree = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-nipopow = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }
ergo-rest = { git = "https://github.com/ergoplatform/sigma-rust", rev = "1633e01835d48e4d4b127f7478e602e129e80110" }