[package]
name = "celaut-client"
description = "Celaut client: the check of a node, quotes, start and stop of a service, and a local port for ServiceTunnel"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
celaut-proto = { workspace = true }
celaut-wire = { workspace = true }
celaut-balancer = { workspace = true }
bee-rpc = { workspace = true }
prost = "0.14"
tokio-stream = { version = "0.1", default-features = false }
futures = { workspace = true }
blake2 = "0.11"
ring = "0.17"
hex = { workspace = true }
sha3 = "0.10"
# The check of a package keeps its hash state on disk (a download that goes on): sha3 0.12 can
# save it. It is the version that bee-rpc uses.
sha3_state = { package = "sha3", version = "0.12" }
data-encoding = "2"
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["time", "net", "io-util", "rt", "fs", "sync"] }

# statvfs, with no unsafe code: the free space of the phone before a download (issue #151).
# Already in the tree (tempfile).
[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tokio-stream = { version = "0.1", default-features = false }
tokio = { workspace = true, features = ["time", "net", "io-util", "rt", "test-util"] }
