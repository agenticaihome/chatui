name: probe-153

# One-off evidence for issue #153 (not part of the PR): arti on the real Tor
# network, and the Linux runner test with PipeWire and with Tor, on both arches.
on:
  push:
    branches: [probe-153]

permissions:
  contents: read

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - name: arti on the real Tor network (celaut-tor real_tor)
        working-directory: rust
        run: |
          uname -m
          cargo test -p celaut-tor --test real_tor -- --ignored --nocapture
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev liblzma-dev \
            xvfb xauth dbus-x11 gnome-keyring pulseaudio-utils pipewire pipewire-pulse wireplumber python3
      - name: Install Flutter
        run: |
          git clone --quiet --depth 1 --branch 3.41.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Runner test with PipeWire and Tor
        run: |
          (cd app && flutter --disable-analytics && flutter pub get --enforce-lockfile)
          SOUND=pipewire scripts/test_linux.sh --dart-define=CHATUI_TEST_TOR=true
