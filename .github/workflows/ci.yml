name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

env:
  # Bump deliberately after running flutter analyze and flutter test on that SDK.
  FLUTTER_VERSION: '3.41.2'

jobs:
  rust:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
      - run: cargo test --workspace

  flutter:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test
      - name: FRB bindings match codegen
        working-directory: .
        run: |
          cargo install cargo-expand --version 1.0.110 --locked
          cargo install flutter_rust_bridge_codegen --version 2.13.0 --locked
          flutter_rust_bridge_codegen generate
          git diff --exit-code
      - name: Chat proto bindings match codegen
        working-directory: .
        run: |
          # ubuntu-24.04 has protoc 3.21.12, the version that scripts/gen_chat_proto.sh pins.
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          scripts/gen_chat_proto.sh
          git diff --exit-code

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # The NDK version is flutter.ndkVersion of FLUTTER_VERSION. Change both together.
      - name: Install the NDK and cargo-ndk
        run: |
          ndk=28.2.13676358
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$ndk" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ndk" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version 4.1.2 --locked
      # Gradle builds libwallet_ffi.so with scripts/build_android.sh.
      - name: Build the debug APK
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug
      - name: Check that the APK has libwallet_ffi.so for each ABI
        run: |
          apk=app/build/app/outputs/flutter-apk/app-debug.apk
          for abi in arm64-v8a x86_64; do
            unzip -l "$apk" "lib/$abi/libwallet_ffi.so" | grep -q libwallet_ffi.so
          done

  # The macOS app (issue #154) on an Apple Silicon runner: a debug build of the app with the
  # Rust core linked in, running integration_test/macos_smoke_test.dart (keychain, links,
  # files, App Nap, zxing, plugins, Tor). The release .dmg is built and launched by release.yml.
  macos:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-darwin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
      # The Xcode build runs scripts/build_macos.sh ("Build the Rust core").
      - name: Run the smoke test in the macOS app
        working-directory: app
        run: |
          flutter pub get --enforce-lockfile
          set -o pipefail
          flutter test integration_test/macos_smoke_test.dart -d macos 2>&1 | tee "$RUNNER_TEMP/macos-smoke.log"
      - name: Summary of the smoke test
        if: always()
        run: grep MACOS_SMOKE "$RUNNER_TEMP/macos-smoke.log" || true
      # The build must not change the tracked files of app/macos (CocoaPods integration,
      # Podfile.lock): they are committed as a Mac build writes them.
      - name: The build changed no tracked file
        run: |
          git status --porcelain
          git diff --exit-code
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: macos-smoke
          path: |
            ${{ runner.temp }}/macos-smoke.log
            app/macos/Podfile.lock
            app/macos/Runner.xcodeproj/project.pbxproj
            app/macos/Flutter/Flutter-Debug.xcconfig
            app/macos/Flutter/Flutter-Release.xcconfig
            app/macos/Runner.xcworkspace/contents.xcworkspacedata
